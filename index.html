<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Ace’s RBLX Sniper • Ultimate 2026</title>

  <style>
    :root {
      --bg: linear-gradient(135deg, #05050a 0%, #0a0a14 100%);
      --card: rgba(16, 16, 30, 0.6);
      --card-border: rgba(255, 255, 255, 0.06);
      --text: #f1f5f9;
      --dim: #94a3b8;
      --accent: #22c55e;
      --accent-glow: #4ade80;
      --danger: #ef4444;
      --blur: blur(22px);
      --shadow: 0 12px 48px rgba(0,0,0,0.55);
    }

    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 12px;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    .container {
      max-width: 100%;
      width: 100%;
      margin: 0 auto;
      background: var(--card);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-radius: 28px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      overflow: hidden;
      touch-action: manipulation;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--card-border);
    }

    .tab-btn {
      flex: 1;
      padding: 16px;
      background: transparent;
      border: none;
      color: var(--dim);
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tab-btn.active {
      color: white;
      border-bottom: 3px solid var(--accent);
      background: rgba(34,197,94,0.08);
    }

    .tab-content {
      display: none;
      padding: 24px 20px;
      animation: fadeInTab 0.4s ease-out;
    }

    .tab-content.active { display: block; }

    @keyframes fadeInTab {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      padding: 28px 20px 16px;
      background: linear-gradient(135deg, rgba(34,197,94,0.1), rgba(74,222,128,0.05));
      border-bottom: 1px solid var(--card-border);
    }

    h1 {
      font-size: clamp(1.7rem, 5.5vw, 2.1rem);
      font-weight: 800;
      background: linear-gradient(90deg, #a1e65c, #4ade80, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 7s linear infinite;
    }

    @keyframes gradientFlow { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }

    label { font-size: 0.95rem; margin-bottom: 8px; display: block; color: var(--dim); font-weight: 500; }

    input[type="range"] {
      width: 100%; height: 10px; margin: 12px 0 24px;
      background: rgba(255,255,255,0.08); border-radius: 999px;
      appearance: none; outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none; width: 26px; height: 26px;
      background: var(--accent); border-radius: 50%; cursor: grab;
      box-shadow: 0 0 16px rgba(34,197,94,0.7); border: 3px solid #111118;
    }

    input[type="text"] {
      width: 100%; padding: 16px; margin-bottom: 20px;
      background: rgba(30,30,46,0.75); border: 1px solid var(--card-border);
      border-radius: 16px; color: white; font-size: 1.05rem;
      transition: all 0.25s;
    }

    input[type="text"]:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(34,197,94,0.22);
    }

    button {
      padding: 16px; border: none; border-radius: 16px;
      font-weight: 700; cursor: pointer; transition: all 0.3s;
      font-size: 1.05rem;
    }

    .main-btn {
      width: 100%; background: linear-gradient(90deg, #16a34a, #22c55e);
      color: white; margin: 20px 0; box-shadow: 0 8px 28px rgba(34,197,94,0.35);
    }

    .main-btn:hover, .main-btn:active { transform: scale(1.03); }

    button.stop { background: linear-gradient(90deg, #dc2626, #ef4444); box-shadow: 0 8px 28px rgba(239,68,68,0.35); }

    .secondary-btn {
      background: rgba(30,30,46,0.85); color: var(--dim);
      font-size: 0.95rem; padding: 12px 20px; margin: 10px 4px;
    }

    .status, .search-result {
      background: rgba(30,30,46,0.65); backdrop-filter: blur(14px);
      padding: 18px; border-radius: 20px; text-align: center;
      margin: 0 0 24px; border: 1px solid var(--card-border);
      min-height: 80px;
    }

    #status.available { color: var(--accent-glow); animation: pulseGlow 2s infinite alternate; }

    @keyframes pulseGlow { from { text-shadow: 0 0 12px rgba(34,197,94,0.4); } to { text-shadow: 0 0 24px rgba(34,197,94,0.8); } }

    #foundContainer {
      max-height: 360px; overflow-y: auto; padding-right: 8px;
      scrollbar-width: thin; scrollbar-color: var(--accent) transparent;
    }

    #foundContainer::-webkit-scrollbar { width: 6px; }
    #foundContainer::-webkit-scrollbar-track { background: transparent; }
    #foundContainer::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

    .found-item {
      background: rgba(30,30,46,0.75); backdrop-filter: blur(12px);
      padding: 16px; border-radius: 16px; display: flex;
      justify-content: space-between; align-items: center;
      margin-bottom: 12px; border: 1px solid var(--card-border);
      animation: bounceIn 0.5s ease-out;
    }

    @keyframes bounceIn { 0% { opacity:0; transform:scale(0.92) translateY(24px); } 60% { transform:scale(1.04) translateY(-4px); } 100% { transform:scale(1) translateY(0); } }

    .found-item button { background: var(--accent); color: white; padding: 10px 18px; font-size: 0.95rem; }

    .search-result strong { color: var(--accent-glow); }

    .footer { text-align: center; font-size: 0.85rem; color: var(--dim); padding: 24px 20px; border-top: 1px solid var(--card-border); }

    .spinner { display: inline-block; width: 20px; height: 20px; border: 4px solid rgba(255,255,255,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; vertical-align: middle; margin-right: 10px; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 500px) {
      body { padding: 10px; }
      .container { border-radius: 24px; }
      .tab-btn { font-size: 1rem; padding: 14px; }
    }

    body::before {
      content: ""; position: fixed; inset: 0;
      background: radial-gradient(circle at 15% 25%, rgba(34,197,94,0.04) 0%, transparent 45%),
                  radial-gradient(circle at 85% 75%, rgba(74,222,128,0.04) 0%, transparent 45%);
      pointer-events: none; z-index: -1;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>Ace’s RBLX Sniper</h1>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="openTab('sniper')">Sniper</button>
      <button class="tab-btn" onclick="openTab('search')">User Search</button>
    </div>

    <div id="sniper" class="tab-content active">
      <label>Username length: <span id="lenVal">5</span></label>
      <input type="range" id="lengthSlider" min="3" max="20" value="5">

      <label>Scan speed (ms delay): <span id="speedVal">1200</span></label>
      <input type="range" id="speedSlider" min="200" max="3000" step="50" value="1200">

      <input id="pattern" placeholder="Pattern (god??, rblx?, ace_??)">

      <input id="webhook" placeholder="Discord webhook (optional)">

      <div style="display:flex; gap:16px; flex-wrap:wrap; margin:16px 0;">
        <label style="display:flex; align-items:center; font-size:0.95rem; color:var(--dim);">
          <input type="checkbox" id="autocopy" checked> Auto-copy
        </label>
        <label style="display:flex; align-items:center; font-size:0.95rem; color:var(--dim);">
          <input type="checkbox" id="sound"> Sound on hit
        </label>
      </div>

      <button id="startBtn" class="main-btn" onclick="toggle()">Start Scanning</button>

      <div class="status">
        <div id="status">Idle — Ready to snipe rare names</div>
        <div id="stats">Scanned: 0 • Found: 0</div>
        <div id="extraStats">CPM: 0 • Time: 00:00</div>
      </div>

      <div style="display:flex; gap:12px; justify-content:center; margin:16px 0;">
        <button class="secondary-btn" onclick="clearFound()">Clear List</button>
        <button class="secondary-btn" onclick="exportFound()">Export All</button>
      </div>

      <div id="foundContainer">
        <div id="foundList"></div>
      </div>
    </div>

    <div id="search" class="tab-content">
      <input id="searchUsername" placeholder="Enter Roblox username to lookup">

      <button class="main-btn" onclick="searchUser()">Search User</button>

      <div id="searchResult" class="search-result">
        Enter a username and hit Search
      </div>
    </div>

    <div class="footer">
      Ultimate 2026 edition • Enjoy responsibly
    </div>
  </div>

  <script>
    // Tab switching
    function openTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
    }

    // Sniper logic
    let scanned = 0, found = 0, running = false, startTime = null;
    const chars = "abcdefghijklmnopqrstuvwxyz0123456789_";
    const statusEl = document.getElementById("status");
    const statsEl = document.getElementById("stats");
    const extraEl = document.getElementById("extraStats");
    const foundList = document.getElementById("foundList");
    const proxy = "https://auth.roproxy.com";
    const usersProxy = "https://users.roproxy.com";
    const birthday = "2000-01-01";
    let cpmInterval;

    const lengthSlider = document.getElementById("lengthSlider");
    const speedSlider = document.getElementById("speedSlider");
    const lenVal = document.getElementById("lenVal");
    const speedVal = document.getElementById("speedVal");
    const autoCopy = document.getElementById("autocopy");
    const soundChk = document.getElementById("sound");

    lengthSlider.oninput = () => lenVal.textContent = lengthSlider.value;
    speedSlider.oninput = () => speedVal.textContent = speedSlider.value;

    function rand() { return chars[Math.floor(Math.random() * chars.length)]; }

    function gen() {
      let len = parseInt(lengthSlider.value);
      let p = document.getElementById("pattern").value.toLowerCase().trim();
      if (p) return [...p].map(c => c === "?" ? rand() : c).join("");
      return Array.from({length: len}, rand).join("");
    }

    async function check(name) {
      try {
        let r = await fetch(`${proxy}/v1/usernames/validate?username=${encodeURIComponent(name)}&birthday=${birthday}`, { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        let j = await r.json();
        return j.code === 0;
      } catch (e) {
        statusEl.textContent = `Error: ${e.message}`;
        return false;
      }
    }

    function sendWebhook(name) {
      let url = document.getElementById("webhook").value.trim();
      if (!url) return;
      fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          content: `🎯 **Available Roblox Username:** \`${name}\`\nLength: ${name.length} chars\nTime: ${new Date().toLocaleTimeString()}\nScan speed: ${speedSlider.value}ms`
        })
      }).catch(() => {});
    }

    function playSound() {
      if (!soundChk.checked) return;
      const audio = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=");
      audio.play().catch(() => {});
    }

    function addFound(n) {
      let d = document.createElement("div");
      d.className = "found-item";
      d.innerHTML = `<span style="font-weight:700;">${n}</span><button onclick="navigator.clipboard.writeText('${n}').then(()=>alert('Copied!'))">Copy</button>`;
      foundList.prepend(d);
      if (foundList.children.length > 12) foundList.removeChild(foundList.lastChild);
      foundList.parentElement.scrollTop = 0;
      if (autoCopy.checked) navigator.clipboard.writeText(n).catch(() => {});
      playSound();
    }

    function updateTimer() {
      if (!startTime) return;
      let elapsed = Math.floor((Date.now() - startTime) / 1000);
      let min = Math.floor(elapsed / 60).toString().padStart(2,'0');
      let sec = (elapsed % 60).toString().padStart(2,'0');
      let cpm = scanned > 0 ? Math.round((scanned / (elapsed / 60 || 1)) * 10) / 10 : 0;
      extraEl.textContent = `CPM: ${cpm} • Time: ${min}:${sec}`;
    }

    function clearFound() { foundList.innerHTML = ""; }
    function exportFound() {
      let names = Array.from(foundList.querySelectorAll('span')).map(s => s.textContent).join('\n');
      if (names) {
        navigator.clipboard.writeText(names).then(() => alert('Exported to clipboard!'));
      } else {
        alert('No names found yet.');
      }
    }

    async function toggle() {
      running = !running;
      const btn = document.getElementById("startBtn");
      btn.textContent = running ? "Stop Scanning" : "Start Scanning";
      btn.classList.toggle("stop", running);

      if (running) {
        startTime = Date.now();
        statusEl.textContent = "Starting...";
        cpmInterval = setInterval(updateTimer, 1000);

        while (running) {
          let name = gen();
          scanned++;
          statusEl.innerHTML = `<span class="spinner"></span>Checking <strong>${name}</strong>`;
          let ok = await check(name);
          if (ok) {
            found++;
            statusEl.textContent = `HIT → ${name}`;
            statusEl.classList.add("available");
            addFound(name);
            sendWebhook(name);
          } else {
            statusEl.textContent = `Taken / Invalid`;
            statusEl.classList.remove("available");
          }
          statsEl.textContent = `Scanned: ${scanned} • Found: ${found}`;
          updateTimer();
          await new Promise(r => setTimeout(r, parseInt(speedSlider.value) + 40));
        }
      } else {
        clearInterval(cpmInterval);
        statusEl.textContent = "Stopped • Good hunting!";
        startTime = null;
        extraEl.textContent = "CPM: 0 • Time: 00:00";
      }
    }

    // User Search
    async function searchUser() {
      const username = document.getElementById("searchUsername").value.trim();
      const resultEl = document.getElementById("searchResult");
      if (!username) {
        resultEl.innerHTML = "Enter a username first.";
        return;
      }

      resultEl.innerHTML = `<span class="spinner"></span> Looking up <strong>${username}</strong>...`;

      try {
        const r = await fetch(`${usersProxy}/v1/usernames/users`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            usernames: [username],
            excludeBannedUsers: false
          })
        });

        if (!r.ok) throw new Error(`HTTP ${r.status}`);

        const j = await r.json();
        if (j.data && j.data.length > 0) {
          const user = j.data[0];
          resultEl.innerHTML = `
            <strong>Found!</strong><br>
            Username: ${user.requestedUsername}<br>
            User ID: <strong>${user.id}</strong><br>
            Verified: ${user.hasVerifiedBadge ? 'Yes' : 'No'}
          `;
        } else {
          resultEl.innerHTML = `No user found for "${username}" (might be invalid or banned).`;
        }
      } catch (e) {
        resultEl.innerHTML = `Error: ${e.message} (proxy or rate limit?)`;
      }
    }
  </script>
</body>
</html>
