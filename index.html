<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Ace's Rbx Name Sniper • gahh!!..</title>

  <style>
    /* Your existing styles here – keeping the glassmorphic look */
    :root {
      --bg: linear-gradient(135deg, #05050a 0%, #0a0a14 100%);
      --card: rgba(16, 16, 30, 0.6);
      --card-border: rgba(255, 255, 255, 0.06);
      --text: #f1f5f9;
      --dim: #94a3b8;
      --accent: #22c55e;
      --accent-glow: #4ade80;
      --danger: #ef4444;
      --blur: blur(22px);
      --shadow: 0 12px 48px rgba(0,0,0,0.55);
    }
    /* ... rest of your CSS unchanged ... */
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>Rbx Name Sniper</h1>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="openTab('sniper')">Sniper</button>
      <button class="tab-btn" onclick="openTab('search')">User Search</button>
    </div>

    <div id="sniper" class="tab-content active">
      <label>Username length: <span id="lenVal">5</span></label>
      <input type="range" id="lengthSlider" min="3" max="20" value="5">

      <label>Scan speed (ms delay): <span id="speedVal">1200</span></label>
      <input type="range" id="speedSlider" min="200" max="3000" step="50" value="1200">

      <input id="pattern" placeholder="Pattern (god??, rblx?, ace_??) or leave blank">

      <div style="margin:16px 0;">
        <label style="display:flex; align-items:center; font-size:0.95rem; color:var(--dim);">
          <input type="checkbox" id="fastMode"> Use uppercase + numbers only (like rbxnamesniper-but-faster)
        </label>
      </div>

      <input id="webhook" placeholder="Discord webhook (optional)">

      <div style="display:flex; gap:16px; flex-wrap:wrap; margin:16px 0;">
        <label style="display:flex; align-items:center; font-size:0.95rem; color:var(--dim);">
          <input type="checkbox" id="autocopy" checked> Auto-copy
        </label>
        <label style="display:flex; align-items:center; font-size:0.95rem; color:var(--dim);">
          <input type="checkbox" id="sound"> Sound on hit
        </label>
      </div>

      <button id="startBtn" class="main-btn" onclick="toggle()">Start Scanning</button>

      <div class="status">
        <div id="status">Idle</div>
        <div id="stats">Scanned: 0 • Found: 0 • No hits yet</div>
        <div id="extraStats">CPM: 0 • Time: 00:00</div>
      </div>

      <div style="display:flex; gap:12px; justify-content:center; margin:16px 0;">
        <button class="secondary-btn" onclick="clearFound()">Clear List</button>
        <button class="secondary-btn" onclick="exportFound()">Export All</button>
      </div>

      <div id="foundContainer">
        <div id="foundList"></div>
      </div>
    </div>

    <!-- User Search tab unchanged -->
    <div id="search" class="tab-content">
      <!-- ... your existing search code ... -->
    </div>

    <div class="footer">
      Fast random mode inspired by rbxnamesniper-but-faster • 2026 edition
    </div>
  </div>

  <script>
    // Your existing tab switching, etc.

    // Add this new variable
    const fastModeChk = document.getElementById("fastMode");

    // Updated chars (dynamic)
    let chars = "abcdefghijklmnopqrstuvwxyz0123456789_"; // default

    function updateCharset() {
      if (fastModeChk.checked) {
        chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      } else {
        chars = "abcdefghijklmnopqrstuvwxyz0123456789_";
      }
    }

    fastModeChk.onchange = updateCharset;
    updateCharset(); // initial

    function rand() {
      return chars[Math.floor(Math.random() * chars.length)];
    }

    function gen() {
      let len = parseInt(lengthSlider.value);
      let p = document.getElementById("pattern").value.toLowerCase().trim();
      if (p) {
        return [...p].map(c => c === "?" ? rand() : c).join("");
      }
      return Array.from({length: len}, rand).join("");
    }

    // In addFound or status update – tweak "No hits yet"
    function addFound(n) {
      // ... existing ...
      statsEl.textContent = `Scanned: ${scanned} • Found: ${found} • Hit found!`;
    }

    // In toggle loop, when !ok:
    // statusEl.textContent = `Taken / Invalid`;  // already there

    // When starting:
    if (running) {
      // ...
      statsEl.textContent = `Scanned: 0 • Found: 0 • No hits yet`;
    }

    // Rest of your script unchanged (check, webhook, etc.)
  </script>
</body>
</html>
