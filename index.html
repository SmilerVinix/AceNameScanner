<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RBX Name Sniper • 2026</title>

  <style>
    :root {
      --bg: #0a0a0f;
      --card: #111118;
      --card-light: #1a1a24;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --accent: #22c55e;
      --accent-dark: #16a34a;
      --danger: #ef4444;
      --danger-dark: #dc2626;
      --border: rgba(255,255,255,0.08);
      --glow: rgba(34,197,94,0.18);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 16px;
      line-height: 1.5;
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    .header {
      padding: 20px 24px;
      background: linear-gradient(to bottom, #16161f, transparent);
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #a1e65c, #4ade80);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .content { padding: 20px 24px 24px; }
    .len-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    button {
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      background: #1e1e2e;
      color: var(--text-dim);
    }
    button:hover { background: #25253a; transform: translateY(-1px); }
    button.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 0 0 3px var(--glow);
    }
    button.stop { background: var(--danger); color: white; }
    button.stop:hover { background: var(--danger-dark); }
    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      margin: 8px 0 20px;
      background: #16161f;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--glow);
    }
    .main-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      border-radius: 12px;
    }
    .status-panel {
      background: rgba(30,30,46,0.6);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      text-align: center;
    }
    #status {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 8px;
      min-height: 1.4em;
    }
    #status.available {
      color: var(--accent);
      text-shadow: 0 0 10px rgba(34,197,94,0.5);
    }
    #stats {
      font-size: 0.95rem;
      color: var(--text-dim);
    }
    .found-list { margin: 16px 0; }
    .found-list h3 {
      font-size: 0.9rem;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .found-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e2e;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    .found-item button {
      padding: 6px 12px;
      font-size: 0.8rem;
      background: var(--accent-dark);
      color: white;
      min-width: 70px;
    }
    .footer {
      text-align: center;
      padding: 16px;
      font-size: 0.78rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
    }
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) {
      body { padding: 12px; }
      .container { border-radius: 12px; }
      .content { padding: 18px 20px 20px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>RBX Name Sniper</h1>
  </div>

  <div class="content">

    <div class="len-buttons">
      <button onclick="setLen(3,5)" class="active">3–5</button>
      <button onclick="setLen(4,6)">4–6</button>
      <button onclick="setLen(5,7)">5–7</button>
    </div>

    <input id="pattern" placeholder="Pattern e.g. god??  nitro?  x?x?" />

    <button id="startBtn" class="main-btn green" onclick="toggle()">
      Start Scanning
    </button>

    <div class="status-panel">
      <div id="status">Idle</div>
      <div id="stats">Scanned: 0  •  Found: 0</div>
    </div>

    <div class="found-list" id="foundList">
      <h3>Recently Found</h3>
    </div>

  </div>

  <div class="footer">made by m7 • 2026 • use at your own risk</div>
</div>

<script>
let min = 3, max = 5;
let running = false;
let scanned = 0;
let foundCount = 0;
let foundNames = [];

const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
const statusEl = document.getElementById("status");
const statsEl  = document.getElementById("stats");
const startBtn = document.getElementById("startBtn");
const foundList = document.getElementById("foundList");
const patternInput = document.getElementById("pattern");

// ─── CONFIG ────────────────────────────────────────
const useProxy = true;                    // set false to try direct (may hit CORS)
const proxyBase = "https://auth.roproxy.com";  // good public proxy 2026
// const proxyBase = "https://users.roproxy.com"; // alt
const birthday = "2000-01-01";            // fixed old date — avoids age gates

function setLen(a, b) {
  min = a; max = b;
  document.querySelectorAll('.len-buttons button').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
}

function randChar() {
  return chars[Math.floor(Math.random() * chars.length)];
}

function generate() {
  const p = patternInput.value.trim().toLowerCase();
  if (p) {
    let out = "";
    for (let c of p) out += (c === "?") ? randChar() : c;
    return out;
  }
  const len = Math.floor(Math.random() * (max - min + 1)) + min;
  let s = "";
  for (let i = 0; i < len; i++) s += randChar();
  return s;
}

function addFound(name) {
  foundNames.unshift(name);
  if (foundNames.length > 6) foundNames.pop();

  foundList.innerHTML = `<h3>Recently Found</h3>`;
  foundNames.forEach(n => {
    const div = document.createElement("div");
    div.className = "found-item";
    div.innerHTML = `
      <span>${n}</span>
      <button onclick="navigator.clipboard.writeText('${n}')">Copy</button>
    `;
    foundList.appendChild(div);
  });
}

async function checkAvailable(name) {
  const base = useProxy ? proxyBase : "https://auth.roblox.com";
  const url = `${base}/v1/usernames/validate?username=${encodeURIComponent(name)}&birthday=${birthday}`;

  try {
    const r = await fetch(url, { method: "GET", cache: "no-store" });
    if (!r.ok) return false; // treat errors as not-available / skip

    const j = await r.json();
    // code: 0 = valid & available, 10 = taken, 1 = invalid format, etc.
    return j.code === 0;
  } catch (e) {
    return false;
  }
}

async function toggle() {
  running = !running;

  if (running) {
    startBtn.textContent = "Stop Scanning";
    startBtn.classList.remove("green");
    startBtn.classList.add("stop");
  } else {
    startBtn.textContent = "Start Scanning";
    startBtn.classList.remove("stop");
    startBtn.classList.add("green");
    statusEl.innerHTML = "Idle";
    statusEl.classList.remove("available");
    return;
  }

  while (running) {
    const name = generate();
    scanned++;
    updateStats();

    statusEl.innerHTML = `<span class="spinner"></span>Checking ${name}...`;

    const isAvail = await checkAvailable(name);

    if (isAvail) {
      foundCount++;
      statusEl.textContent = `AVAILABLE → ${name}`;
      statusEl.classList.add("available");
      addFound(name);
      updateStats();
      // optional: await new Promise(r=>setTimeout(r,3000)); // longer pause on hit
    } else {
      statusEl.textContent = `Taken / Invalid: ${name}`;
      statusEl.classList.remove("available");
    }

    await new Promise(r => setTimeout(r, 1200)); // ~0.8 req/sec — safe-ish
  }
}

function updateStats() {
  statsEl.textContent = `Scanned: ${scanned.toLocaleString()}  •  Found: ${foundCount}`;
}
</script>

</body>
</html>
