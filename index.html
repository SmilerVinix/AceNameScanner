<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ace’s RBLX Name Sniper</title>

<style>
:root{
--bg:#0a0a0f;--card:#111118;--text:#e2e8f0;--dim:#94a3b8;
--accent:#22c55e;--danger:#ef4444;--border:rgba(255,255,255,.08)
}
*{box-sizing:border-box;margin:0;padding:0}
body{
background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
padding:14px
}
.container{
max-width:420px;margin:auto;background:var(--card);
border-radius:14px;border:1px solid var(--border);overflow:hidden
}
.header{text-align:center;padding:18px;border-bottom:1px solid var(--border)}
h1{
font-size:1.5rem;
background:linear-gradient(90deg,#a1e65c,#4ade80);
-webkit-background-clip:text;-webkit-text-fill-color:transparent
}
.content{padding:18px}
button{
padding:12px;border:none;border-radius:10px;
background:#1e1e2e;color:var(--dim);font-weight:600;cursor:pointer;margin-bottom:8px
}
button.stop{background:var(--danger);color:#fff}
input[type="text"],input[type="range"]{
width:100%;padding:12px;margin-bottom:10px;background:#16161f;
border:1px solid var(--border);border-radius:10px;color:#fff
}
.main-btn{width:100%;font-size:1.05rem;margin-bottom:14px}
.status{
background:#1e1e2e;padding:14px;border-radius:10px;
text-align:center;margin-bottom:14px
}
#status.available{color:var(--accent)}
.found-item{
background:#1e1e2e;padding:10px;border-radius:8px;
display:flex;justify-content:space-between;margin-bottom:6px
}
.footer{
text-align:center;font-size:.75rem;color:var(--dim);
padding:14px;border-top:1px solid var(--border)
}
.spinner{
display:inline-block;width:16px;height:16px;
border:3px solid rgba(255,255,255,.2);
border-top-color:var(--accent);
border-radius:50%;animation:spin 1s linear infinite;
vertical-align:middle;margin-right:6px
}
@keyframes spin{to{transform:rotate(360deg)}}
label{font-size:.85rem;margin-bottom:4px;display:block}
</style>
</head>

<body>
<div class="container">
<div class="header"><h1>Ace’s RBLX Name Sniper</h1></div>

<div class="content">

<label>Username length: <span id="lenVal">5</span></label>
<input type="range" id="lengthSlider" min="3" max="20" value="5">

<label>Scan speed (ms delay): <span id="speedVal">1200</span></label>
<input type="range" id="speedSlider" min="200" max="3000" step="50" value="1200">

<input id="pattern" placeholder="Pattern (ab??, x?x?)">
<input id="webhook" placeholder="Paste your Discord webhook">

<button id="startBtn" class="main-btn" onclick="toggle()">Start Scanning</button>

<div class="status">
<div id="status">Idle</div>
<div id="stats">Scanned: 0 • Found: 0</div>
</div>

<div id="foundList"></div>

</div>

<div class="footer">
made by Aceii_. On discord • https://discord.gg/kAAhfyKdvC
</div>

</div>

<script>
let scanned=0,found=0,running=false
const chars="abcdefghijklmnopqrstuvwxyz0123456789"
const statusEl=document.getElementById("status")
const statsEl=document.getElementById("stats")
const foundList=document.getElementById("foundList")
const proxy="https://auth.roproxy.com"
const birthday="2000-01-01"

const lengthSlider=document.getElementById("lengthSlider")
const speedSlider=document.getElementById("speedSlider")
const lenVal=document.getElementById("lenVal")
const speedVal=document.getElementById("speedVal")

lengthSlider.oninput=function(){lenVal.textContent=this.value}
speedSlider.oninput=function(){speedVal.textContent=this.value}

function rand(){return chars[Math.floor(Math.random()*chars.length)]}

function gen(){
let len=parseInt(lengthSlider.value)
let p=document.getElementById("pattern").value.toLowerCase().trim()
if(p){return [...p].map(c=>c=="?"?rand():c).join("")}
return Array.from({length:len},rand).join("")
}

async function check(name){
try{
let r=await fetch(`${proxy}/v1/usernames/validate?username=${name}&birthday=${birthday}`)
let j=await r.json()
return j.code===0
}catch{return false}
}

function sendWebhook(name){
let url=document.getElementById("webhook").value.trim()
if(!url) return
fetch(url,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
content:`✅ **Available Roblox Username:** \`${name}\`\n🚀 Join our server: https://discord.gg/kAAhfyKdvC`
})
})
}

function addFound(n){
let d=document.createElement("div")
d.className="found-item"
d.innerHTML=`<span>${n}</span><button onclick="navigator.clipboard.writeText('${n}')">Copy</button>`
foundList.prepend(d)
if(foundList.children.length>6) foundList.removeChild(foundList.lastChild)
}

async function toggle(){
running=!running
const btn=document.getElementById("startBtn")
btn.textContent=running?"Stop Scanning":"Start Scanning"
btn.classList.toggle("stop",running)

while(running){
let name=gen()
scanned++
statusEl.innerHTML=`<span class="spinner"></span>Checking ${name}...`
let ok=await check(name)
if(ok){
found++
statusEl.textContent=`AVAILABLE → ${name}`
statusEl.classList.add("available")
addFound(name)
sendWebhook(name)
}else{
statusEl.textContent=`Taken / Invalid`
statusEl.classList.remove("available")
}
statsEl.textContent=`Scanned: ${scanned} • Found: ${found}`
await new Promise(r=>setTimeout(r,parseInt(speedSlider.value)))
}
}
</script>
</body>
</html>
