<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Ace Name Sniper • ULTIMATE 2026 🔥</title>

  <style>
    :root {
      --bg: linear-gradient(135deg, #020208 0%, #0a0a14 50%, #0f0f1f 100%);
      --card: rgba(15, 15, 30, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --dim: #a0aec0;
      --accent: #10b981;
      --accent-glow: #34d399;
      --danger: #ef4444;
      --warning: #f59e0b;
      --blur: blur(25px);
      --shadow: 0 20px 60px rgba(0,0,0,0.6);
      --neon-glow: 0 0 30px rgba(16, 185, 129, 0.6);
    }

    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 12px;
      overflow-x: hidden;
      position: relative;
    }

    /* PARTICLE BACKGROUND */
    .particles {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
    }
    .particle {
      position: absolute; width: 4px; height: 4px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      border-radius: 50%; animation: float 6s infinite linear;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-120vh) rotate(360deg); }
    }

    .container {
      max-width: 100%; width: 100%; margin: 0 auto;
      background: var(--card); backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur); border-radius: 32px;
      border: 1px solid var(--card-border); box-shadow: var(--shadow);
      overflow: hidden; touch-action: manipulation; z-index: 10;
      position: relative;
    }

    .header {
      text-align: center; padding: 36px 24px 24px;
      background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(52,211,153,0.08));
      border-bottom: 1px solid var(--card-border); position: relative;
      overflow: hidden;
    }
    .header::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(16,185,129,0.1) 0%, transparent 50%);
      animation: wave 8s ease-in-out infinite;
    }
    @keyframes wave { 0%, 100% { transform: translateX(-100%) scaleX(1); } 50% { transform: translateX(100%) scaleX(1.1); } }

    h1 {
      font-size: clamp(1.8rem, 6vw, 2.4rem); font-weight: 900;
      background: linear-gradient(90deg, #10b981, #34d399, #6ee7b7, #10b981);
      background-size: 300% 100%; -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; animation: gradientFlow 4s ease infinite;
      text-shadow: var(--neon-glow); position: relative; z-index: 2;
    }
    @keyframes gradientFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    .tabs { display: flex; border-bottom: 1px solid var(--card-border); }
    .tab-btn {
      flex: 1; padding: 20px; background: transparent; border: none;
      color: var(--dim); font-weight: 700; font-size: 1.1rem;
      cursor: pointer; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative; overflow: hidden;
    }
    .tab-btn::before {
      content: ''; position: absolute; inset: 0; background: var(--accent);
      transform: scaleX(0); transform-origin: left; transition: transform 0.4s;
      opacity: 0.1;
    }
    .tab-btn.active {
      color: var(--accent-glow); 
    }
    .tab-btn.active::before { transform: scaleX(1); }
    .tab-btn:hover { transform: translateY(-2px); }

    .tab-content {
      display: none; padding: 28px 24px; animation: slideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tab-content.active { display: block; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    label { 
      font-size: 1rem; margin-bottom: 10px; display: block; 
      color: var(--dim); font-weight: 600; 
    }
    input[type="range"] {
      width: 100%; height: 12px; margin: 12px 0 28px;
      background: rgba(255,255,255,0.1); border-radius: 999px;
      appearance: none; outline: none; cursor: grab;
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none; width: 28px; height: 28px;
      background: linear-gradient(45deg, var(--accent), var(--accent-glow));
      border-radius: 50%; cursor: grab; box-shadow: var(--neon-glow);
      border: 3px solid rgba(255,255,255,0.2);
    }
    input[type="text"], input[type="file"] {
      width: 100%; padding: 18px 20px; margin-bottom: 20px;
      background: rgba(30,30,50,0.8); border: 1px solid var(--card-border);
      border-radius: 20px; color: white; font-size: 1.1rem;
      transition: all 0.3s; backdrop-filter: blur(10px);
    }
    input[type="text"]:focus, input[type="file"]:focus {
      outline: none; border-color: var(--accent); box-shadow: var(--neon-glow);
      transform: scale(1.02);
    }

    button {
      padding: 18px 24px; border: none; border-radius: 20px;
      font-weight: 800; cursor: pointer; transition: all 0.4s;
      font-size: 1.1rem; position: relative; overflow: hidden;
      backdrop-filter: blur(10px);
    }
    button::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(45deg, var(--accent), var(--accent-glow));
      transform: scale(0); transition: transform 0.3s;
    }
    button:hover::before { transform: scale(1.1); }
    button:active { transform: scale(0.98); }

    .main-btn {
      width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent-glow));
      color: white; margin: 24px 0; box-shadow: var(--neon-glow), 0 12px 40px rgba(16,185,129,0.4);
      font-size: 1.2rem;
    }
    button.stop { 
      background: linear-gradient(135deg, var(--danger), #f87171);
      box-shadow: 0 12px 40px rgba(239,68,68,0.4);
    }

    .status {
      background: rgba(30,30,50,0.7); backdrop-filter: blur(20px);
      padding: 24px; border-radius: 24px; text-align: center;
      margin: 24px 0; border: 1px solid var(--card-border);
      min-height: 100px; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    #status {
      font-size: 1.3rem; font-weight: 800; margin-bottom: 12px;
      background: linear-gradient(90deg, var(--text), var(--dim));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #status.available {
      color: var(--accent-glow) !important;
      animation: neonPulse 1.5s infinite alternate, shake 0.5s;
      text-shadow: 0 0 40px var(--accent-glow);
    }
    @keyframes neonPulse {
      from { filter: drop-shadow(0 0 10px var(--accent)); }
      to { filter: drop-shadow(0 0 30px var(--accent-glow)); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    #foundContainer {
      max-height: 400px; overflow-y: auto; padding-right: 12px;
      scrollbar-width: thin; scrollbar-color: var(--accent) transparent;
    }
    #foundContainer::-webkit-scrollbar { width: 8px; }
    #foundContainer::-webkit-scrollbar-thumb {
      background: linear-gradient(var(--accent), var(--accent-glow));
      border-radius: 4px;
    }

    .found-item {
      background: rgba(16,185,129,0.2); backdrop-filter: blur(15px);
      padding: 20px; border-radius: 20px; display: flex;
      justify-content: space-between; align-items: center;
      margin-bottom: 16px; border: 2px solid var(--accent-glow);
      animation: explodeIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: var(--neon-glow);
    }
    @keyframes explodeIn {
      0% { 
        opacity: 0; transform: scale(0) rotate(180deg) translateY(50px);
      }
      60% { 
        opacity: 1; transform: scale(1.1) rotate(-10deg) translateY(-10px);
      }
      100% { 
        transform: scale(1) rotate(0deg) translateY(0);
      }
    }

    .live-feed {
      background: rgba(20,20,35,0.9); border-radius: 16px;
      padding: 16px; margin: 20px 0; max-height: 200px;
      overflow-y: auto; font-family: 'Courier New', monospace;
      border-left: 4px solid var(--accent);
    }

    .footer {
      text-align: center; font-size: 0.9rem; color: var(--dim);
      padding: 28px 24px; border-top: 1px solid var(--card-border);
    }

    @media (max-width: 500px) {
      body { padding: 8px; }
      .container { border-radius: 24px; }
      button { padding: 16px; font-size: 1rem; }
    }
  </style>
</head>

<body>
  <!-- PARTICLE SYSTEM -->
  <div class="particles" id="particles"></div>

  <div class="container">
    <div class="header">
      <h1>🔥 Rbx Name Sniper</h1>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="sniper">🎯 Sniper</button>
      <button class="tab-btn" data-tab="search">🔍 User Search</button>
    </div>

    <div id="sniper" class="tab-content active">
      <label>Length: <span id="lenVal">5</span></label>
      <input type="range" id="lengthSlider" min="3" max="20" value="5">

      <label>Speed (ms): <span id="speedVal">800</span></label>
      <input type="range" id="speedSlider" min="200" max="2000" step="50" value="800">

      <input id="prefix" placeholder="Prefix (e.g. xX)" maxlength="4">
      <input id="suffix" placeholder="Suffix (e.g. _OG)" maxlength="4">
      <input id="pattern" placeholder="Pattern (god??, rblxX?)">

      <div style="display:flex; gap:20px; flex-wrap:wrap; margin:20px 0;">
        <label style="display:flex; align-items:center; font-size:0.95rem; color:var(--dim); flex:1;">
          <input type="checkbox" id="fastMode" checked> 🚀 Fast Mode (A-Z0-9)
        </label>
        <label style="display:flex; align-items:center; font-size:0.95rem; color:var(--dim); flex:1;">
          <input type="range" id="volumeSlider" min="0" max="100" value="50" style="width:60px;"> Sound
        </label>
      </div>

      <input type="file" id="wordlist" accept=".txt" style="display:none;">
      <button class="main-btn secondary" onclick="document.getElementById('wordlist').click()">
        📁 Upload Wordlist
      </button>

      <input id="webhook" placeholder="🔗 Discord Webhook (optional)">

      <button id="startBtn" class="main-btn" onclick="toggleSniper()">🚀 START SNIPING</button>

      <div class="status">
        <div id="status">Idle — Ready to hunt rare names 🔥</div>
        <div id="stats">Scanned: 0 • Found: 0 • No hits yet</div>
        <div id="extraStats">CPM: 0 • Time: 00:00</div>
      </div>

      <div class="live-feed" id="liveFeed">
        <div>💤 Waiting to start...</div>
      </div>

      <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:24px 0;">
        <button class="secondary-btn" onclick="clearFound()" style="background:var(--warning); color:white;">
          🗑️ Clear List
        </button>
        <button class="secondary-btn" onclick="exportTxt()" style="background:#8b5cf6; color:white;">
          💾 Export TXT
        </button>
      </div>

      <div id="foundContainer">
        <div id="foundList"></div>
      </div>
    </div>

    <div id="search" class="tab-content">
      <input id="searchUsername" placeholder="👤 Enter username to lookup">
      <button class="main-btn" onclick="searchUser()">🔍 SEARCH USER</button>
      <div id="searchResult" class="status">
        Enter a username above 👆
      </div>
    </div>

    <div class="footer">
      Ultimate 2026 Edition • Made for Sammie in Columbus, OH 🌃 • 06:22 AM EST
    </div>
  </div>

  <script>
    // GLOBALS
    let scanned = 0, found = 0, running = false, startTime = null, wordlist = [];
    let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"; // fast mode default
    const proxy = "https://auth.roproxy.com";
    const usersProxy = "https://users.roproxy.com";
    const birthday = "2000-01-01";
    let cpmInterval, feedLines = [];

    // ELEMENTS
    const lengthSlider = document.getElementById("lengthSlider");
    const speedSlider = document.getElementById("speedSlider");
    const lenVal = document.getElementById("lenVal");
    const speedVal = document.getElementById("speedVal");
    const fastMode = document.getElementById("fastMode");
    const volumeSlider = document.getElementById("volumeSlider");
    const statusEl = document.getElementById("status");
    const statsEl = document.getElementById("stats");
    const extraEl = document.getElementById("extraStats");
    const foundList = document.getElementById("foundList");
    const liveFeed = document.getElementById("liveFeed");
    const foundContainer = document.getElementById("foundContainer");

    // EVENT LISTENERS
    lengthSlider.oninput = () => lenVal.textContent = lengthSlider.value;
    speedSlider.oninput = () => speedVal.textContent = speedSlider.value;
    fastMode.onchange = updateCharset;

    function updateCharset() {
      chars = fastMode.checked ? "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789" : "abcdefghijklmnopqrstuvwxyz0123456789_";
    }

    // PARTICLES
    function createParticles() {
      const particles = document.getElementById("particles");
      for(let i = 0; i < 50; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.style.left = Math.random() * 100 + "%";
        p.style.animationDelay = Math.random() * 6 + "s";
        p.style.animationDuration = (Math.random() * 3 + 4) + "s";
        particles.appendChild(p);
      }
    }

    // TABS
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(btn.dataset.tab).classList.add('active');
        btn.classList.add('active');
      };
    });

    // GENERATION
    function rand() { return chars[Math.floor(Math.random() * chars.length)]; }
    function gen() {
      let len = parseInt(lengthSlider.value);
      let prefix = document.getElementById("prefix").value.toUpperCase();
      let suffix = document.getElementById("suffix").value.toUpperCase();
      let pattern = document.getElementById("pattern").value.toUpperCase().trim();
      
      let name = "";
      if (pattern) {
        name = [...pattern].map(c => c === "?" ? rand() : c).join("");
      } else {
        name = Array.from({length: len}, rand).join("");
      }
      return prefix + name + suffix;
    }

    // CHECK
    async function check(name) {
      try {
        let r = await fetch(`${proxy}/v1/usernames/validate?username=${encodeURIComponent(name)}&birthday=${birthday}`, { 
          cache: "no-store", 
          mode: 'cors'
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        let j = await r.json();
        return j.code === 0;
      } catch (e) {
        return false;
      }
    }

    // WEBHOOK
    function sendWebhook(name) {
      let url = document.getElementById("webhook").value.trim();
      if (!url) return;
      fetch(url, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          content: `🎯 **SNIPED!** \`${name}\` (${name.length} chars)\n${new Date().toLocaleTimeString()}\nSpeed: ${speedSlider.value}ms`
        })
      }).catch(() => {});
    }

    // SOUND
    function playSound() {
      let vol = volumeSlider.value / 100;
      const audio = new Audio("data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQBDYgA=");
      audio.volume = vol;
      audio.play().catch(() => {});
    }

    // ADD FOUND
    function addFound(n) {
      let d = document.createElement("div");
      d.className = "found-item";
      d.innerHTML = `
        <div style="font-weight:900; font-size:1.3rem;">🎉 ${n}</div>
        <div>
          <button onclick="navigator.clipboard.writeText('${n}').then(()=>alert('✅ Copied!'))" 
                  style="margin-right:8px; background:var(--accent-glow);">📋 Copy</button>
          <a href="https://www.roblox.com/users/profile?username=${n}" target="_blank" 
             style="background:#3b82f6; color:white; padding:10px 16px; text-decoration:none; border-radius:12px;">
            ⚡ Claim
          </a>
        </div>
      `;
      foundList.prepend(d);
      if (foundList.children.length > 15) foundList.removeChild(foundList.lastChild);
      foundContainer.scrollTop = 0;
      navigator.clipboard.writeText(n);
      playSound();
    }

    // LIVE FEED
    function addFeed(msg) {
      feedLines.unshift(`[${new Date().toLocaleTimeString()}] ${msg}`);
      if (feedLines.length > 50) feedLines.pop();
      liveFeed.innerHTML = feedLines.map(line => `<div>${line}</div>`).join('');
      liveFeed.scrollTop = 0;
    }

    // STATS
    function updateStats() {
      if (!startTime) return;
      let elapsed = (Date.now() - startTime) / 1000 / 60;
      let cpm = Math.round((scanned / (elapsed || 1)) * 10) / 10;
      let min = Math.floor(elapsed).toString().padStart(2,'0');
      let sec = Math.floor((elapsed % 1) * 60).toString().padStart(2,'0');
      extraEl.textContent = `⚡ CPM: ${cpm} • ⏱️ ${min}:${sec}`;
      statsEl.textContent = `📊 Scanned: ${scanned.toLocaleString()} • 🎯 Found: ${found}`;
    }

    // CLEAR/EXPORT
    function clearFound() { foundList.innerHTML = ""; }
    function exportTxt() {
      let names = Array.from(foundList.querySelectorAll('.found-item div:first-child')).map(d => d.textContent.replace('🎉 ', '')).join('\n');
      if (!names) { alert('No hits yet!'); return; }
      const blob = new Blob([names], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `rbxsniper_hits_${new Date().toISOString().slice(0,10)}.txt`;
      a.click(); URL.revokeObjectURL(url);
    }

    // WORDLIST
    document.getElementById("wordlist").onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          wordlist = ev.target.result.split('\n').map(w => w.trim()).filter(w => w);
          addFeed(`📁 Loaded ${wordlist.length} words from wordlist`);
        };
        reader.readAsText(file);
      }
    };

    // MAIN TOGGLE
    async function toggleSniper() {
      running = !running;
      const btn = document.getElementById("startBtn");
      
      if (running) {
        startTime = Date.now();
        scanned = found = 0; feedLines = ["🚀 SNIPING STARTED!"];
        btn.textContent = "⏹️ STOP SNIPING";
        btn.classList.add("stop");
        statusEl.textContent = "🔥 HUNTING...";
        cpmInterval = setInterval(updateStats, 1000);
        addFeed("🔥 Fast mode enabled");

        while (running) {
          let name = wordlist.length ? wordlist[Math.floor(Math.random() * wordlist.length)] : gen();
          scanned++;
          
          statusEl.innerHTML = `⚡ Checking <strong>${name}</strong>...`;
          addFeed(`🔍 Testing: ${name}`);
          
          let available = await check(name);
          
          if (available) {
            found++;
            statusEl.textContent = `🎉 HIT! ${name}`;
            statusEl.classList.add("available");
            addFound(name);
            sendWebhook(name);
            addFeed(`✅ HIT! ${name} (AVAILABLE!)`);
          } else {
            statusEl.textContent = "❌ Taken";
            statusEl.classList.remove("available");
          }
          
          updateStats();
          await new Promise(r => setTimeout(r, Math.max(200, parseInt(speedSlider.value))));
        }
      } else {
        clearInterval(cpmInterval);
        btn.textContent = "🚀 START SNIPING";
        btn.classList.remove("stop");
        statusEl.textContent = "⏸️ Stopped — Ready for next hunt";
        addFeed("⏹️ Sniping stopped");
      }
    }

    // USER SEARCH
    async function searchUser() {
      const username = document.getElementById("searchUsername").value.trim();
      const result = document.getElementById("searchResult");
      if (!username) return result.innerHTML = "👤 Enter username";
      
      result.innerHTML = `<span style="animation:spin 1s linear infinite;">⏳</span> Searching...`;
      
      try {
        const r = await fetch(`${usersProxy}/v1/usernames/users`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usernames: [username], excludeBannedUsers: false })
        });
        const j = await r.json();
        if (j.data?.length) {
          const user = j.data[0];
          result.innerHTML = `
            ✅ <strong>FOUND!</strong><br>
            👤 Username: ${user.requestedUsername}<br>
            🆔 ID: <strong>${user.id}</strong><br>
            🏅 Verified: ${user.hasVerifiedBadge ? '✅ YES' : '❌ No'}
          `;
        } else {
          result.innerHTML = `❌ No user "${username}" found`;
        }
      } catch (e) {
        result.innerHTML = `💥 Error: ${e.message}`;
      }
    }

    // INIT
    createParticles();
    updateCharset();
    updateStats();
  </script>
</body>
</html>
