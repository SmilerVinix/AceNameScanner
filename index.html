<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>RBLX Sniper • 2026 Reloaded</title>

  <style>
    :root {
      --bg-1: #0a0012;
      --bg-2: #11001f;
      --card: rgba(18, 18, 35, 0.82);
      --card-border: rgba(120, 100, 255, 0.14);
      --text: #f0f4ff;
      --dim: #b0b8ff;
      --accent: #7c3aed;
      --accent-glow: #a78bfa;
      --success: #22c55e;
      --success-glow: #4ade80;
      --danger: #f87171;
      --blur: blur(24px);
      --shadow: 0 16px 48px rgba(0,0,0,0.65);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding: 10px 12px;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    .container {
      max-width: 100%;
      margin: 0 auto;
      background: var(--card);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-radius: 28px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    header {
      padding: 20px 24px 16px;
      text-align: center;
      background: linear-gradient(to bottom, rgba(124,58,237,0.12), transparent);
      position: relative;
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 800;
      background: linear-gradient(90deg, #c084fc, #a78bfa, #7c3aed, #c084fc);
      background-size: 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient 7s linear infinite;
    }

    @keyframes gradient {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .status-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 14px;
      background: rgba(34,197,94,0.15);
      border: 1px solid rgba(34,197,94,0.4);
      border-radius: 999px;
      font-size: 0.9rem;
      color: #4ade80;
    }

    .segmented {
      display: flex;
      margin: 16px 24px 0;
      background: rgba(30,30,50,0.6);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(120,100,255,0.2);
    }

    .segment-btn {
      flex: 1;
      padding: 14px;
      background: transparent;
      border: none;
      color: var(--dim);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.25s;
    }

    .segment-btn.active {
      background: rgba(124,58,237,0.35);
      color: white;
      box-shadow: inset 0 0 12px rgba(124,58,237,0.3);
    }

    .content {
      padding: 24px;
    }

    .group {
      margin-bottom: 28px;
    }

    .group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: var(--dim);
      font-weight: 500;
    }

    input[type=range] {
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,0.08);
      border-radius: 5px;
      appearance: none;
    }

    input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 24px;
      height: 24px;
      background: var(--accent-glow);
      border-radius: 50%;
      border: 3px solid #1e1e38;
      box-shadow: 0 0 16px rgba(124,58,237,0.6);
    }

    input[type=text] {
      width: 100%;
      padding: 14px 16px;
      background: rgba(30,30,50,0.75);
      border: 1px solid rgba(120,100,255,0.2);
      border-radius: 16px;
      color: white;
      font-size: 1.05rem;
      transition: all 0.2s;
    }

    input[type=text]:focus {
      outline: none;
      border-color: var(--accent-glow);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.25);
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 16px 0;
    }

    .preset-btn {
      padding: 10px 16px;
      background: rgba(30,30,50,0.8);
      border: 1px solid rgba(120,100,255,0.25);
      border-radius: 12px;
      color: var(--dim);
      font-size: 0.9rem;
      cursor: pointer;
    }

    .preset-btn:hover {
      background: rgba(124,58,237,0.25);
      color: white;
    }

    #startBtn {
      width: 100%;
      padding: 18px;
      margin: 24px 0 32px;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      color: white;
      font-size: 1.2rem;
      font-weight: 700;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 12px 32px rgba(124,58,237,0.4);
      transition: all 0.3s;
    }

    #startBtn.stop {
      background: linear-gradient(135deg, #ef4444, #f87171);
      box-shadow: 0 12px 32px rgba(239,68,68,0.4);
    }

    #status {
      font-size: 1.35rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
      min-height: 2.2em;
    }

    #status.hit {
      background: linear-gradient(90deg, #22c55e, #4ade80, #22c55e);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: flow 3s linear infinite;
    }

    @keyframes flow {
      0%   { background-position: 0% }
      100% { background-position: 200% }
    }

    .found-item {
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.35);
      padding: 16px 20px;
      border-radius: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      0% { transform: scale(0.7) translateY(30px); opacity: 0; }
      70% { transform: scale(1.08) translateY(-6px); }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .found-name {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #foundContainer {
      max-height: 420px;
      overflow-y: auto;
      padding-right: 8px;
    }

    #foundContainer::-webkit-scrollbar {
      width: 7px;
    }

    #foundContainer::-webkit-scrollbar-thumb {
      background: linear-gradient(var(--accent), var(--accent-glow));
      border-radius: 4px;
    }

    .footer {
      text-align: center;
      padding: 24px 20px;
      color: var(--dim);
      font-size: 0.85rem;
      border-top: 1px solid rgba(120,100,255,0.12);
    }

    canvas#confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }

    @media (max-width: 500px) {
      header { padding: 16px 20px 12px; }
      h1 { font-size: 1.8rem; }
      .content { padding: 20px; }
      #startBtn { font-size: 1.1rem; padding: 16px; }
    }
  </style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="container">
  <header>
    <h1>RBLX Sniper</h1>
    <div class="status-badge" id="statusBadge">Idle</div>
  </header>

  <div class="segmented">
    <button class="segment-btn active" data-panel="main">Snipe</button>
    <button class="segment-btn" data-panel="lookup">Lookup</button>
    <button class="segment-btn" data-panel="tools">Tools</button>
  </div>

  <div class="content" id="mainPanel">
    <div class="group">
      <label>Length <span id="lenVal">5</span></label>
      <input type="range" id="length" min="3" max="16" value="5">
    </div>

    <div class="group">
      <label>Delay <span id="delayVal">900</span> ms</label>
      <input type="range" id="delay" min="300" max="2500" step="100" value="900">
    </div>

    <div class="group">
      <label>Pattern / prefix</label>
      <input type="text" id="pattern" placeholder="e.g. god??   xX_   RBLX">
    </div>

    <div class="row">
      <button class="preset-btn" onclick="setPreset(3)">3 char</button>
      <button class="preset-btn" onclick="setPreset(4)">4 char</button>
      <button class="preset-btn" onclick="setPreset('num4')">4 numbers</button>
      <button class="preset-btn" onclick="setPreset('rare')">Rare style</button>
    </div>

    <button id="startBtn">START SNIPING</button>

    <div id="status">Ready to hunt • 06:31 AM EST</div>

    <div style="margin:24px 0; font-size:0.95rem; color:var(--dim); text-align:center;">
      <div>Scanned: <span id="scanned">0</span></div>
      <div>Found: <span id="foundCount">0</span></div>
      <div id="speedometer">0.0 / sec</div>
    </div>

    <div id="foundContainer"></div>
  </div>

  <div class="content" id="lookupPanel" style="display:none">
    <div class="group">
      <label>Username</label>
      <input type="text" id="lookupName" placeholder="Enter username">
    </div>
    <button style="width:100%; background:#3b82f6; color:white; padding:16px; border:none; border-radius:16px; font-weight:600; cursor:pointer;">
      Lookup User ID
    </button>
    <div id="lookupResult" style="margin-top:20px; min-height:80px; color:var(--dim);"></div>
  </div>

  <div class="content" id="toolsPanel" style="display:none">
    <div style="text-align:center; padding:60px 0; color:var(--dim); font-size:1.1rem;">
      More features coming soon...<br><br>
      • Wordlist upload<br>
      • Discord webhook<br>
      • Auto-copy toggle<br>
      • Sound on hit<br>
      • Export hits
    </div>
  </div>

  <div class="footer">
    Columbus, Ohio • February 04, 2026 • 06:31 AM EST
  </div>
</div>

<script>
// ──────────────────────────────────────────────
//  Control logic
// ──────────────────────────────────────────────

const panels = {
  main: document.getElementById('mainPanel'),
  lookup: document.getElementById('lookupPanel'),
  tools: document.getElementById('toolsPanel')
};

document.querySelectorAll('.segment-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.segment-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    Object.values(panels).forEach(p => p.style.display = 'none');
    panels[btn.dataset.panel].style.display = 'block';
  };
});

const lengthSlider   = document.getElementById('length');
const delaySlider    = document.getElementById('delay');
const lenVal         = document.getElementById('lenVal');
const delayVal       = document.getElementById('delayVal');
const patternInput   = document.getElementById('pattern');
const startBtn       = document.getElementById('startBtn');
const statusEl       = document.getElementById('status');
const scannedEl      = document.getElementById('scanned');
const foundEl        = document.getElementById('foundCount');
const speedEl        = document.getElementById('speedometer');
const badge          = document.getElementById('statusBadge');

let running = false;
let scanned = 0;
let found   = 0;
let lastTime = performance.now();
let checksThisSec = 0;

lengthSlider.oninput = () => lenVal.textContent = lengthSlider.value;
delaySlider.oninput  = () => delayVal.textContent  = delaySlider.value;

function setPreset(v) {
  if (v === 'num4') {
    patternInput.value = '????';
    lengthSlider.value = 4; lenVal.textContent = 4;
  } else if (v === 'rare') {
    patternInput.value = 'x?x?x';
  } else {
    lengthSlider.value = v;
    lenVal.textContent = v;
    patternInput.value = '';
  }
}

function randChar() {
  const s = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  return s[Math.floor(Math.random()*s.length)];
}

function generateName() {
  let pat = patternInput.value.trim();
  if (!pat) {
    return Array(+lengthSlider.value).fill().map(randChar).join('');
  }
  return pat.replace(/\?/g, randChar);
}

function addFound(name) {
  found++;
  foundEl.textContent = found;

  const item = document.createElement('div');
  item.className = 'found-item';
  item.innerHTML = `
    <div class="found-name">${name}</div>
    <div style="display:flex; gap:12px;">
      <button onclick="navigator.clipboard.writeText('${name}').then(()=>alert('Copied!'))"
              style="background:#4ade80; color:black; padding:8px 14px; border:none; border-radius:12px; cursor:pointer;">
        Copy
      </button>
      <a href="https://www.roblox.com/users/profile?username=${encodeURIComponent(name)}" target="_blank"
         style="background:#3b82f6; color:white; padding:8px 14px; border-radius:12px; text-decoration:none;">
        Profile
      </a>
    </div>
  `;
  document.getElementById('foundContainer').prepend(item);

  // trigger confetti
  confetti({
    particleCount: 80,
    spread: 80,
    origin: { y: 0.6 },
    colors: ['#22c55e', '#4ade80', '#86efac', '#a78bfa']
  });
}

async function check(name) {
  try {
    const r = await fetch(`https://auth.roproxy.com/v1/usernames/validate?username=${encodeURIComponent(name)}&birthday=2000-01-01`);
    const j = await r.json();
    return j.code === 0;
  } catch {
    return false;
  }
}

function updateSpeed() {
  const now = performance.now();
  const dt = now - lastTime;
  if (dt > 1000) {
    speedEl.textContent = (checksThisSec / (dt/1000)).toFixed(1) + ' / sec';
    checksThisSec = 0;
    lastTime = now;
  }
}

startBtn.onclick = async () => {
  running = !running;
  startBtn.textContent = running ? 'STOP' : 'START SNIPING';
  startBtn.classList.toggle('stop', running);
  badge.textContent = running ? 'Scanning…' : 'Idle';

  if (!running) {
    statusEl.textContent = 'Stopped';
    return;
  }

  statusEl.textContent = 'Starting scan...';
  scanned = found = 0;
  scannedEl.textContent = foundEl.textContent = '0';
  document.getElementById('foundContainer').innerHTML = '';

  while (running) {
    const name = generateName();
    scanned++;
    scannedEl.textContent = scanned;
    checksThisSec++;

    statusEl.textContent = `Checking ${name} …`;

    const available = await check(name);

    if (available) {
      statusEl.classList.add('hit');
      statusEl.textContent = `HIT → ${name}`;
      addFound(name);
      setTimeout(() => statusEl.classList.remove('hit'), 2200);
    }

    updateSpeed();

    await new Promise(r => setTimeout(r, parseInt(delaySlider.value)));
  }
};

// minimal confetti function
function confetti(opts) {
  const c = document.getElementById('confetti');
  const ctx = c.getContext('2d');
  c.width = window.innerWidth;
  c.height = window.innerHeight;

  let particles = [];
  for (let i = 0; i < opts.particleCount; i++) {
    particles.push({
      x: Math.random() * c.width,
      y: Math.random() * c.height * 0.4,
      r: Math.random() * 5 + 3,
      color: opts.colors[Math.floor(Math.random() * opts.colors.length)],
      vx: (Math.random() - 0.5) * opts.spread / 10,
      vy: Math.random() * 4 + 2,
      rot: Math.random() * 360,
      vr: (Math.random() - 0.5) * 10
    });
  }

  function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    particles.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);
      ctx.restore();

      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.vy += 0.18; // gravity
      if (p.y > c.height) p.y = -20;
    });

    if (particles.some(p => p.y < c.height + 50)) {
      requestAnimationFrame(draw);
    } else {
      ctx.clearRect(0, 0, c.width, c.height);
    }
  }

  draw();
}

window.addEventListener('resize', () => {
  const c = document.getElementById('confetti');
  c.width = window.innerWidth;
  c.height = window.innerHeight;
});
</script>
</body>
</html>
