<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ace’s RBLX Name Sniper • Upgraded</title>

  <style>
    :root {
      --bg: linear-gradient(135deg, #0a0a0f 0%, #0f0f1a 100%);
      --card: rgba(20, 20, 35, 0.45);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #e2e8f0;
      --dim: #94a3b8;
      --accent: #22c55e;
      --accent-glow: #4ade80;
      --danger: #ef4444;
      --blur: blur(16px);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 20px 16px;
      background-attachment: fixed;
    }

    .container {
      max-width: 460px;
      margin: 0 auto;
      background: var(--card);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-radius: 24px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      text-align: center;
      padding: 28px 20px 20px;
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.08), rgba(74, 222, 128, 0.05));
      border-bottom: 1px solid var(--card-border);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(90deg, #a1e65c, #4ade80, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .content {
      padding: 24px 20px;
    }

    label {
      font-size: 0.9rem;
      margin-bottom: 6px;
      display: block;
      color: var(--dim);
      font-weight: 500;
    }

    input[type="range"] {
      width: 100%;
      height: 8px;
      margin: 12px 0 20px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      appearance: none;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 20px;
      height: 20px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(34,197,94,0.5);
      border: 2px solid #111118;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      background: rgba(30,30,46,0.6);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: white;
      font-size: 1rem;
      transition: all 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(34,197,94,0.15);
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .main-btn {
      width: 100%;
      background: linear-gradient(90deg, #16a34a, #22c55e);
      color: white;
      font-size: 1.1rem;
      margin: 20px 0 24px;
      box-shadow: 0 6px 20px rgba(34,197,94,0.25);
    }

    .main-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(34,197,94,0.35);
    }

    button.stop {
      background: linear-gradient(90deg, #dc2626, #ef4444);
      box-shadow: 0 6px 20px rgba(239,68,68,0.25);
    }

    .status {
      background: rgba(30,30,46,0.5);
      backdrop-filter: blur(8px);
      padding: 16px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid var(--card-border);
    }

    #status.available {
      color: var(--accent-glow);
      font-weight: 600;
      text-shadow: 0 0 10px rgba(34,197,94,0.4);
    }

    .found-item {
      background: rgba(30,30,46,0.6);
      backdrop-filter: blur(10px);
      padding: 14px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border: 1px solid var(--card-border);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .found-item button {
      background: var(--accent);
      color: white;
      padding: 8px 14px;
      font-size: 0.9rem;
    }

    .found-item button:hover {
      background: #16a34a;
    }

    .footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--dim);
      padding: 20px;
      border-top: 1px solid var(--card-border);
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 500px) {
      .container { border-radius: 20px; }
      .content { padding: 20px 16px; }
    }
  </style>
</head>
